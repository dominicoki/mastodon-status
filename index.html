<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PureHeart Status</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #181818;
    color: #f5f5f5;
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

h1 {
    margin-bottom: 20px;
}

.banner {
    padding: 15px;
    border-radius: 8px;
    font-size: 1.2em;
    font-weight: bold;
    margin-bottom: 25px;
}

.operational {
    background: #2ea043;
}

.outage {
    background: #da3633;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 12px;
    border-bottom: 1px solid #333;
    text-align: left;
}

.status-ok {
    color: #3fb950;
    font-weight: bold;
}

.status-bad {
    color: #ff7b72;
    font-weight: bold;
}

.footer {
    margin-top: 20px;
    color: #999;
}

</style>
</head>

<body>

<h1>PureHeart Status</h1>

<div id="banner" class="banner operational">
Loading...
</div>

<table>
<thead>
<tr>
<th>Service</th>
<th>Status</th>
</tr>
</thead>

<tbody id="services">
</tbody>
</table>

<div class="footer">
    Last Updated:
    <span id="updated">Loading...</span>
</div>

    <script src="script.js" defer></script>

<a rel="me" href="https://social.pureheart.page/@dominic">Mastodon</a>
    <meta name="fediverse:creator" content="@dominic@social.pureheart.page">
    
</body>
</html>
